<!doctype html>
<html lang="zh-TW" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動測驗系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
        body {
            box-sizing: border-box;
        }
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quiz-option {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .quiz-option:hover {
            transform: translateX(8px);
        }

        .quiz-option.selected {
            transform: scale(1.02);
        }

        .progress-bar {
            transition: width 0.5s ease;
        }

        .toast {
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="h-full w-full overflow-auto">
  <div id="app" class="min-h-full w-full"></div>
  <script>
        const defaultConfig = {
            quiz_title: "程式設計測驗",
            welcome_message: "歡迎參加測驗！請輸入您的姓名開始",
            teacher_password: "teacher123",
            background_color: "#f0fdf4",
            surface_color: "#ffffff",
            text_color: "#064e3b",
            primary_action_color: "#10b981",
            secondary_action_color: "#6b7280",
            font_family: "Noto Sans TC",
            font_size: 16
        };

        // Quiz questions data
        const quizQuestions = [
            {
                id: 1,
                question: "Python 中哪個關鍵字用於定義函數？",
                options: ["func", "def", "function", "define"],
                correctAnswer: 1,
                explanation: "在 Python 中，使用 'def' 關鍵字來定義函數。"
            },
            {
                id: 2,
                question: "下列哪個是 Python 的正確註解語法？",
                options: ["// 註解", "/* 註解 */", "# 註解", "-- 註解"],
                correctAnswer: 2,
                explanation: "Python 使用 '#' 符號作為單行註解的開始。"
            },
            {
                id: 3,
                question: "如何在 Python 中建立一個空列表？",
                options: ["list()", "[]", "{}-()", "以上皆可"],
                correctAnswer: 3,
                explanation: "Python 中可以使用 list() 或 [] 來建立空列表，兩者都是正確的。"
            },
            {
                id: 4,
                question: "Python 中的 'print()' 函數預設的分隔符號是什麼？",
                options: ["逗號", "空格", "分號", "無分隔"],
                correctAnswer: 1,
                explanation: "print() 函數在多個參數之間預設使用空格作為分隔符號。"
            },
            {
                id: 5,
                question: "下列哪個不是 Python 的資料型態？",
                options: ["int", "float", "char", "str"],
                correctAnswer: 2,
                explanation: "Python 沒有 'char' 型態，字元是使用長度為 1 的字串來表示。"
            }
        ];

        // Application state
        let currentView = 'home';
        let studentName = '';
        let currentQuestionIndex = 0;
        let studentAnswers = Array(quizQuestions.length).fill(null);
        let quizResults = [];

        // Data SDK handler
        const dataHandler = {
            onDataChanged(data) {
                quizResults = data;
                if (currentView === 'teacher-dashboard' || 
                    currentView === 'teacher-scores' || 
                    currentView === 'teacher-analytics' || 
                    currentView === 'teacher-leaderboard') {
                    renderApp();
                }
            }
        };

        // Initialize SDK
        async function initializeApp() {
            const initResult = await window.dataSdk.init(dataHandler);
            if (!initResult.isOk) {
                console.error("Failed to initialize data SDK");
            }
            
            if (window.elementSdk) {
                window.elementSdk.init({
                    defaultConfig,
                    onConfigChange: async (config) => {
                        updateStyles(config);
                        renderApp();
                    },
                    mapToCapabilities: (config) => ({
                        recolorables: [
                            {
                                get: () => config.background_color || defaultConfig.background_color,
                                set: (value) => {
                                    config.background_color = value;
                                    window.elementSdk.setConfig({ background_color: value });
                                }
                            },
                            {
                                get: () => config.surface_color || defaultConfig.surface_color,
                                set: (value) => {
                                    config.surface_color = value;
                                    window.elementSdk.setConfig({ surface_color: value });
                                }
                            },
                            {
                                get: () => config.text_color || defaultConfig.text_color,
                                set: (value) => {
                                    config.text_color = value;
                                    window.elementSdk.setConfig({ text_color: value });
                                }
                            },
                            {
                                get: () => config.primary_action_color || defaultConfig.primary_action_color,
                                set: (value) => {
                                    config.primary_action_color = value;
                                    window.elementSdk.setConfig({ primary_action_color: value });
                                }
                            },
                            {
                                get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                                set: (value) => {
                                    config.secondary_action_color = value;
                                    window.elementSdk.setConfig({ secondary_action_color: value });
                                }
                            }
                        ],
                        borderables: [],
                        fontEditable: {
                            get: () => config.font_family || defaultConfig.font_family,
                            set: (value) => {
                                config.font_family = value;
                                window.elementSdk.setConfig({ font_family: value });
                            }
                        },
                        fontSizeable: {
                            get: () => config.font_size || defaultConfig.font_size,
                            set: (value) => {
                                config.font_size = value;
                                window.elementSdk.setConfig({ font_size: value });
                            }
                        }
                    }),
                    mapToEditPanelValues: (config) => new Map([
                        ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
                        ["welcome_message", config.welcome_message || defaultConfig.welcome_message],
                        ["teacher_password", config.teacher_password || defaultConfig.teacher_password]
                    ])
                });
            }
            
            renderApp();
        }

        function updateStyles(config) {
            const backgroundColor = config.background_color || defaultConfig.background_color;
            const surfaceColor = config.surface_color || defaultConfig.surface_color;
            const textColor = config.text_color || defaultConfig.text_color;
            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;
            const fontFamily = config.font_family || defaultConfig.font_family;
            const fontSize = config.font_size || defaultConfig.font_size;

            document.body.style.backgroundColor = backgroundColor;
            document.body.style.color = textColor;
            document.body.style.fontFamily = `${fontFamily}, sans-serif`;
            document.body.style.fontSize = `${fontSize}px`;
        }

        function getConfig() {
            return window.elementSdk?.config || defaultConfig;
        }

        function renderApp() {
            const config = getConfig();
            const app = document.getElementById('app');
            
            const views = {
                'home': renderHomeView,
                'quiz': renderQuizView,
                'results': renderResultsView,
                'teacher-login': renderTeacherLoginView,
                'teacher-dashboard': renderTeacherDashboard,
                'teacher-scores': renderTeacherScores,
                'teacher-analytics': renderTeacherAnalytics,
                'teacher-leaderboard': renderTeacherLeaderboard
            };

            const renderFunction = views[currentView] || renderHomeView;
            app.innerHTML = renderFunction(config);

            if (currentView === 'teacher-analytics') {
                setTimeout(() => renderCharts(), 100);
            }
        }

        function renderHomeView(config) {
            const backgroundColor = config.background_color || defaultConfig.background_color;
            const surfaceColor = config.surface_color || defaultConfig.surface_color;
            const textColor = config.text_color || defaultConfig.text_color;
            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;
            const fontSize = config.font_size || defaultConfig.font_size;
            const quizTitle = config.quiz_title || defaultConfig.quiz_title;
            const welcomeMessage = config.welcome_message || defaultConfig.welcome_message;

            return `
                <div class="flex items-center justify-center min-h-full p-6" style="background-color: ${backgroundColor};">
                    <div class="max-w-md w-full fade-in">
                        <div class="text-center mb-8">
                            <h1 class="font-bold mb-4" style="font-size: ${fontSize * 2}px; color: ${textColor};">
                                ${quizTitle}
                            </h1>
                            <p style="font-size: ${fontSize * 1.125}px; color: ${textColor}; opacity: 0.8;">
                                ${welcomeMessage}
                            </p>
                        </div>
                        
                        <div class="rounded-2xl shadow-2xl p-8" style="background-color: ${surfaceColor};">
                            <form onsubmit="startQuiz(event)" class="space-y-6">
                                <div>
                                    <label for="studentName" class="block font-medium mb-2" style="font-size: ${fontSize}px; color: ${textColor};">
                                        學生姓名
                                    </label>
                                    <input 
                                        type="text" 
                                        id="studentName" 
                                        required 
                                        class="w-full px-4 py-3 rounded-lg border-2 transition-all"
                                        style="font-size: ${fontSize}px; border-color: ${primaryColor}; background-color: ${surfaceColor}; color: ${textColor};"
                                        placeholder="請輸入您的姓名"
                                    />
                                </div>
                                
                                <button 
                                    type="submit" 
                                    class="w-full py-4 rounded-lg font-bold text-white transition-all hover:opacity-90"
                                    style="font-size: ${fontSize * 1.125}px; background-color: ${primaryColor};"
                                >
                                    開始測驗
                                </button>
                            </form>
                            
                            <div class="mt-6 pt-6 border-t" style="border-color: ${textColor}; opacity: 0.2;">
                                <button 
                                    onclick="showTeacherLogin()" 
                                    class="w-full py-3 rounded-lg font-medium transition-all hover:opacity-80"
                                    style="font-size: ${fontSize}px; background-color: ${secondaryColor}; color: white;"
                                >
                                    教師登入
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuizView(config) {
            const backgroundColor = config.background_color || defaultConfig.background_color;
            const surfaceColor = config.surface_color || defaultConfig.surface_color;
            const textColor = config.text_color || defaultConfig.text_color;
            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;
            const fontSize = config.font_size || defaultConfig.font_size;

            const question = quizQuestions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
            const selectedAnswer = studentAnswers[currentQuestionIndex];

            return `
                <div class="min-h-full p-6" style="background-color: ${backgroundColor};">
                    <div class="max-w-3xl mx-auto fade-in">
                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-medium" style="font-size: ${fontSize}px; color: ${textColor};">
                                    題目 ${currentQuestionIndex + 1} / ${quizQuestions.length}
                                </span>
                                <span class="font-medium" style="font-size: ${fontSize}px; color: ${textColor};">
                                    ${studentName}
                                </span>
                            </div>
                            <div class="h-3 rounded-full overflow-hidden" style="background-color: ${surfaceColor};">
                                <div class="progress-bar h-full transition-all" style="width: ${progress}%; background-color: ${primaryColor};"></div>
                            </div>
                        </div>

                        <div class="rounded-2xl shadow-2xl p-8" style="background-color: ${surfaceColor};">
                            <h2 class="font-bold mb-8" style="font-size: ${fontSize * 1.5}px; color: ${textColor};">
                                ${question.question}
                            </h2>

                            <div class="space-y-4">
                                ${question.options.map((option, index) => `
                                    <button 
                                        onclick="selectAnswer(${index})" 
                                        class="quiz-option w-full p-4 rounded-xl border-2 text-left transition-all ${selectedAnswer === index ? 'selected' : ''}"
                                        style="font-size: ${fontSize}px; 
                                               color: ${textColor}; 
                                               border-color: ${selectedAnswer === index ? primaryColor : textColor}; 
                                               background-color: ${selectedAnswer === index ? primaryColor + '20' : surfaceColor};"
                                    >
                                        <span class="font-bold mr-3">${String.fromCharCode(65 + index)}.</span>
                                        ${option}
                                    </button>
                                `).join('')}
                            </div>

                            <div class="flex gap-4 mt-8">
                                <button 
                                    onclick="previousQuestion()" 
                                    ${currentQuestionIndex === 0 ? 'disabled' : ''}
                                    class="flex-1 py-3 rounded-lg font-medium transition-all hover:opacity-80 disabled:opacity-40"
                                    style="font-size: ${fontSize}px; background-color: ${secondaryColor}; color: white;"
                                >
                                    上一題
                                </button>
                                <button 
                                    onclick="nextQuestion()" 
                                    class="flex-1 py-3 rounded-lg font-bold text-white transition-all hover:opacity-90"
                                    style="font-size: ${fontSize}px; background-color: ${primaryColor};"
                                >
                                    ${currentQuestionIndex === quizQuestions.length - 1 ? '完成測驗' : '下一題'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderResultsView(config) {
            const backgroundColor = config.background_color || defaultConfig.background_color;
            const surfaceColor = config.surface_color || defaultConfig.surface_color;
            const textColor = config.text_color || defaultConfig.text_color;
            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            const fontSize = config.font_size || defaultConfig.font_size;

            const score = studentAnswers.filter((answer, index) => 
                answer === quizQuestions[index].correctAnswer
            ).length;
            const percentage = Math.round((score / quizQuestions.length) * 100);

            return `
                <div class="min-h-full p-6" style="background-color: ${backgroundColor};">
                    <div class="max-w-4xl mx-auto fade-in">
                        <div class="text-center mb-8">
                            <h1 class="font-bold mb-4" style="font-size: ${fontSize * 2}px; color: ${textColor};">
                                測驗完成！
                            </h1>
                            <div class="inline-block rounded-2xl shadow-2xl p-8" style="background-color: ${surfaceColor};">
                                <p class="font-medium mb-2" style="font-size: ${fontSize * 1.125}px; color: ${textColor};">
                                    ${studentName}
                                </p>
                                <p class="font-bold mb-4" style="font-size: ${fontSize * 3}px; color: ${primaryColor};">
                                    ${score} / ${quizQuestions.length}
                                </p>
                                <p class="font-bold" style="font-size: ${fontSize * 1.5}px; color: ${textColor};">
                                    得分率：${percentage}%
                                </p>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <h2 class="font-bold" style="font-size: ${fontSize * 1.5}px; color: ${textColor};">
                                詳細解析
                            </h2>
                            ${quizQuestions.map((question, index) => {
                                const isCorrect = studentAnswers[index] === question.correctAnswer;
                                return `
                                    <div class="rounded-xl shadow-lg p-6" style="background-color: ${surfaceColor};">
                                        <div class="flex items-start gap-4 mb-4">
                                            <span class="font-bold px-3 py-1 rounded-lg text-white" 
                                                  style="font-size: ${fontSize}px; background-color: ${isCorrect ? '#10b981' : '#ef4444'};">
                                                ${isCorrect ? '✓' : '✗'}
                                            </span>
                                            <div class="flex-1">
                                                <p class="font-bold mb-2" style="font-size: ${fontSize * 1.125}px; color: ${textColor};">
                                                    題目 ${index + 1}：${question.question}
                                                </p>
                                                <p class="mb-2" style="font-size: ${fontSize}px; color: ${textColor}; opacity: 0.7;">
                                                    你的答案：${studentAnswers[index] !== null ? question.options[studentAnswers[index]] : '未作答'}
                                                </p>
                                                <p class="font-medium mb-3" style="font-size: ${fontSize}px; color: ${primaryColor};">
                                                    正確答案：${question.options[question.correctAnswer]}
                                                </p>
                                                <p class="italic" style="font-size: ${fontSize * 0.875}px; color: ${textColor}; opacity: 0.8;">
                                                    ${question.explanation}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="mt-8 text-center">
                            <button 
                                onclick="returnHome()" 
                                class="px-8 py-4 rounded-lg font-bold text-white transition-all hover:opacity-90"
                                style="font-size: ${fontSize * 1.125}px; background-color: ${primaryColor};"
                            >
                                返回首頁
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTeacherLoginView(config) {
            const backgroundColor = config.background_color || defaultConfig.background_color;
            const surfaceColor = config.surface_color || defaultConfig.surface_color;
            const textColor = config.text_color || defaultConfig.text_color;
            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;
            const fontSize = config.font_size || defaultConfig.font_size;

            return `
                <div class="flex items-center justify-center min-h-full p-6" style="background-color: ${backgroundColor};">
                    <div class="max-w-md w-full fade-in">
                        <div class="text-center mb-8">
                            <h1 class="font-bold" style="font-size: ${fontSize * 2}px; color: ${textColor};">
                                教師登入
                            </h1>
                        </div>
                        
                        <div class="rounded-2xl shadow-2xl p-8" style="background-color: ${surfaceColor};">
                            <form onsubmit="teacherLogin(event)" class="space-y-6">
                                <div>
                                    <label for="teacherPassword" class="block font-medium mb-2" style="font-size: ${fontSize}px; color: ${textColor};">
                                        密碼
                                    </label>
                                    <input 
                                        type="password" 
                                        id="teacherPassword" 
                                        required 
                                        class="w-full px-4 py-3 rounded-lg border-2 transition-all"
                                        style="font-size: ${fontSize}px; border-color: ${primaryColor}; background-color: ${surfaceColor}; color: ${textColor};"
                                        placeholder="請輸入教師密碼"
                                    />
                                </div>
                                
                                <button 
                                    type="submit" 
                                    class="w-full py-4 rounded-lg font-bold text-white transition-all hover:opacity-90"
                                    style="font-size: ${fontSize * 1.125}px; background-color: ${primaryColor};"
                                >
                                    登入
                                </button>
                            </form>
                            
                            <div class="mt-6">
                                <button 
                                    onclick="returnHome()" 
                                    class="w-full py-3 rounded-lg font-medium transition-all hover:opacity-80"
                                    style="font-size: ${fontSize}px; background-color: ${secondaryColor}; color: white;"
                                >
                                    返回首頁
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTeacherDashboard(config) {
            const backgroundColor = config.background_color || defaultConfig.background_color;
            const surfaceColor = config.surface_color || defaultConfig.surface_color;
            const textColor = config.text_color || defaultConfig.text_color;
            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            const fontSize = config.font_size || defaultConfig.font_size;

            const totalStudents = quizResults.length;
            const avgScore = totalStudents > 0 
                ? (quizResults.reduce((sum, r) => sum + r.score, 0) / totalStudents).toFixed(1)
                : 0;
            const passRate = totalStudents > 0
                ? ((quizResults.filter(r => (r.score / r.total_questions) >= 0.6).length / totalStudents) * 100).toFixed(1)
                : 0;

            return `
                <div class="min-h-full p-6" style="background-color: ${backgroundColor};">
                    <div class="max-w-6xl mx-auto fade-in">
                        ${renderTeacherNav(config)}
                        
                        <h1 class="font-bold mb-8" style="font-size: ${fontSize * 2}px; color: ${textColor};">
                            儀表板
                        </h1>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="rounded-xl shadow-lg p-6" style="background-color: ${surfaceColor};">
                                <p class="font-medium mb-2" style="font-size: ${fontSize}px; color: ${textColor}; opacity: 0.7;">
                                    總參與人數
                                </p>
                                <p class="font-bold" style="font-size: ${fontSize * 2.5}px; color: ${primaryColor};">
                                    ${totalStudents}
                                </p>
                            </div>
                            <div class="rounded-xl shadow-lg p-6" style="background-color: ${surfaceColor};">
                                <p class="font-medium mb-2" style="font-size: ${fontSize}px; color: ${textColor}; opacity: 0.7;">
                                    平均分數
                                </p>
                                <p class="font-bold" style="font-size: ${fontSize * 2.5}px; color: ${primaryColor};">
                                    ${avgScore}
                                </p>
                            </div>
                            <div class="rounded-xl shadow-lg p-6" style="background-color: ${surfaceColor};">
                                <p class="font-medium mb-2" style="font-size: ${fontSize}px; color: ${textColor}; opacity: 0.7;">
                                    及格率
                                </p>
                                <p class="font-bold" style="font-size: ${fontSize * 2.5}px; color: ${primaryColor};">
                                    ${passRate}%
                                </p>
                            </div>
                        </div>

                        <div class="rounded-xl shadow-lg p-6" style="background-color: ${surfaceColor};">
                            <h2 class="font-bold mb-4" style="font-size: ${fontSize * 1.5}px; color: ${textColor};">
                                最近測驗記錄
                            </h2>
                            ${quizResults.length > 0 ? `
                                <div class="overflow-x-auto">
                                    <table class="w-full">
                                        <thead>
                                            <tr class="border-b-2" style="border-color: ${textColor}; opacity: 0.2;">
                                                <th class="text-left py-3 font-bold" style="font-size: ${fontSize}px; color: ${textColor};">姓名</th>
                                                <th class="text-center py-3 font-bold" style="font-size: ${fontSize}px; color: ${textColor};">分數</th>
                                                <th class="text-center py-3 font-bold" style="font-size: ${fontSize}px; color: ${textColor};">完成時間</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${quizResults.slice(-5).reverse().map(result => `
                                                <tr class="border-b" style="border-color: ${textColor}; opacity: 0.1;">
                                                    <td class="py-3" style="font-size: ${fontSize}px; color: ${textColor};">
                                                        ${result.student_name}
                                                    </td>
                                                    <td class="text-center font-bold" style="font-size: ${fontSize}px; color: ${primaryColor};">
                                                        ${result.score} / ${result.total_questions}
                                                    </td>
                                                    <td class="text-center" style="font-size: ${fontSize * 0.875}px; color: ${textColor}; opacity: 0.7;">
                                                        ${new Date(result.completed_at).toLocaleString('zh-TW')}
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            ` : `

        function renderTeacherLeaderboard(config) {

            const sortedResults = [...quizResults].sort((a, b) => {
                const aPercent = a.score / a.total_questions;
                const bPercent = b.score / b.total_questions;
                if (bPercent !== aPercent) return bPercent - aPercent;
                return new Date(a.completed_at) - new Date(b.completed_at);
            });

            return `

            const navItems = [

        function renderCharts() {
            const config = getConfig();
            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            
            // Score distribution chart
            const scoreRanges = [0, 0, 0, 0, 0];
            quizResults.forEach(result => {
                const percentage = (result.score / result.total_questions) * 100;
                if (percentage < 20) scoreRanges[0]++;
                else if (percentage < 40) scoreRanges[1]++;
                else if (percentage < 60) scoreRanges[2]++;
                else if (percentage < 80) scoreRanges[3]++;
                else scoreRanges[4]++;
            });

            const scoreDistCtx = document.getElementById('scoreDistChart');
            if (scoreDistCtx) {
                new Chart(scoreDistCtx, {
                    type: 'bar',
                    data: {
                        labels: ['0-20%', '20-40%', '40-60%', '60-80%', '80-100%'],
                        datasets: [{
                            label: '人數',
                            data: scoreRanges,
                            backgroundColor: primaryColor,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            }

            // Daily test chart
            const dailyData = {};
            quizResults.forEach(result => {
                const date = new Date(result.completed_at).toLocaleDateString('zh-TW');
                dailyData[date] = (dailyData[date] || 0) + 1;
            });

            const dates = Object.keys(dailyData).sort();
            const counts = dates.map(date => dailyData[date]);

            const dailyTestCtx = document.getElementById('dailyTestChart');
            if (dailyTestCtx) {
                new Chart(dailyTestCtx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: '測驗人數',
                            data: counts,
                            borderColor: primaryColor,
                            backgroundColor: primaryColor + '20',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            }
        }

        // Event handlers
        function startQuiz(event) {
            event.preventDefault();
            const nameInput = document.getElementById('studentName');
            studentName = nameInput.value.trim();
            if (studentName) {
                currentView = 'quiz';
                currentQuestionIndex = 0;
                studentAnswers = Array(quizQuestions.length).fill(null);
                renderApp();
            }
        }

        function selectAnswer(index) {
            studentAnswers[currentQuestionIndex] = index;
            renderApp();
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderApp();
            }
        }

        async function nextQuestion() {
            if (currentQuestionIndex < quizQuestions.length - 1) {
                currentQuestionIndex++;
                renderApp();
            } else {
                await finishQuiz();
            }
        }

        async function finishQuiz() {
            const score = studentAnswers.filter((answer, index) => 
                answer === quizQuestions[index].correctAnswer
            ).length;

            const answersString = studentAnswers.map((answer, index) => {
                const isCorrect = answer === quizQuestions[index].correctAnswer;
                return `Q${index + 1}:${isCorrect ? '✓' : '✗'}`;
            }).join(' ');

            if (quizResults.length >= 999) {
                showToast('已達測驗記錄上限（999筆），無法儲存新記錄');
                currentView = 'results';
                renderApp();
                return;
            }

            const result = await window.dataSdk.create({
                student_name: studentName,
                score: score,
                total_questions: quizQuestions.length,
                answers: answersString,
                completed_at: new Date().toISOString()
            });

            if (result.isOk) {
                currentView = 'results';
                renderApp();
            } else {
                showToast('儲存成績時發生錯誤，請稍後再試');
                console.error('Failed to save quiz result:', result.error);
            }
        }

        function showTeacherLogin() {
            currentView = 'teacher-login';
            renderApp();
        }

        function teacherLogin(event) {
            event.preventDefault();
            const config = getConfig();
            const passwordInput = document.getElementById('teacherPassword');
            const correctPassword = config.teacher_password || defaultConfig.teacher_password;
            
            if (passwordInput.value === correctPassword) {
                currentView = 'teacher-dashboard';
                renderApp();
            } else {
                showToast('密碼錯誤，請重試');
                passwordInput.value = '';
            }
        }

        function navigateTeacher(view) {
            currentView = view;
            renderApp();
        }

        function logoutTeacher() {
            currentView = 'home';
            renderApp();
        }

        function returnHome() {
            currentView = 'home';
            studentName = '';
            currentQuestionIndex = 0;
            studentAnswers = Array(quizQuestions.length).fill(null);
            renderApp();
        }

        function showToast(message) {
            const config = getConfig();
            const surfaceColor = config.surface_color || defaultConfig.surface_color;
            const textColor = config.text_color || defaultConfig.text_color;
            const fontSize = config.font_size || defaultConfig.font_size;

            const toast = document.createElement('div');
            toast.className = 'toast fixed top-6 right-6 rounded-lg shadow-2xl p-4 z-50';
            toast.style.backgroundColor = surfaceColor;
            toast.style.color = textColor;
            toast.style.fontSize = `${fontSize}px`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize app
        initializeApp();
